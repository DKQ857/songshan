name: Bug 反馈
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先搜索是否已有同类 issue。
        ⚠️ 请勿在 issue 中粘贴真实 API Key、证书密码或个人信息。
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 发生了什么？期望的结果是什么？
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 尽量给出 1、2、3 步的稳定复现路径
      placeholder: |
        1. 打开应用进入 …
        2. 点击 …
        3. 出现 …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: DevEco Studio 的 HiLog 片段或界面截图（请先打码敏感信息）
      render: shell
  - type: input
    id: device
    attributes:
      label: 设备与系统
      placeholder: 例如 HarmonyOS NEXT 6.1.0 / 模拟器 或 真机型号
  - type: checkboxes
    id: checks
    attributes:
      label: 确认项
      options:
        - label: 我已搜索过现有 issue，确认没有重复
          required: true
        - label: 我未在内容中包含任何密钥、密码或个人信息
          required: true
